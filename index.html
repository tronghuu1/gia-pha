<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gia Phả Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
/* ================= tokens ================= */
:root{
  --bg:#F1EEE9;
  --surface:#FFFFFF;
  --surface-2:#F8F5F0;
  --ink:#1E1815;
  --ink-2:#5C5148;
  --ink-3:#8A7D71;
  --line:#DFD7CC;
  --line-2:#EBE5DC;
  --accent:#A32A1E;
  --accent-ink:#FFFFFF;
  --accent-soft:#F3DFDB;
  --gold:#8E7126;
  --gold-line:#CBB784;
  --male:#1668B0;
  --female:#C2185B;
  --surface-gone:#ECE6DC;
  --ok:#3F6B4A;
  --warn:#8A6212;
  --shadow-1:0 1px 2px rgba(50,34,24,.07);
  --shadow-2:0 1px 2px rgba(50,34,24,.06),0 10px 24px -14px rgba(50,34,24,.35);
  --shadow-3:0 24px 60px -20px rgba(40,26,18,.38),0 2px 8px rgba(40,26,18,.10);
  --r:10px;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141010;
    --surface:#1E1816;
    --surface-2:#251E1A;
    --ink:#EFE7DC;
    --ink-2:#B8A899;
    --ink-3:#8B7C6F;
    --line:#352B25;
    --line-2:#2A221D;
    --accent:#E4675A;
    --accent-ink:#1B0F0C;
    --accent-soft:#3B211D;
    --gold:#C9A24A;
    --gold-line:#6E5829;
    --male:#7CB8E8;
    --female:#F0789F;
    --surface-gone:#2A211C;
    --ok:#78AE86;
    --warn:#D6AC57;
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 1px 2px rgba(0,0,0,.45),0 10px 24px -14px rgba(0,0,0,.8);
    --shadow-3:0 24px 60px -20px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#141010; --surface:#1E1816; --surface-2:#251E1A; --ink:#EFE7DC; --ink-2:#B8A899;
  --ink-3:#8B7C6F; --line:#352B25; --line-2:#2A221D; --accent:#E4675A; --accent-ink:#1B0F0C;
  --accent-soft:#3B211D; --gold:#C9A24A; --gold-line:#6E5829; --male:#7CB8E8; --female:#F0789F; --surface-gone:#2A211C;
  --ok:#78AE86; --warn:#D6AC57;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 1px 2px rgba(0,0,0,.45),0 10px 24px -14px rgba(0,0,0,.8);
  --shadow-3:0 24px 60px -20px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ================= shell ================= */
#app{display:flex;flex-direction:column;height:100%}

.bar{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:9px 13px;background:var(--surface);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow-1);
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0;padding-right:2px}
.brand .seal{
  flex:0 0 auto;width:27px;height:27px;border-radius:6px;background:var(--accent);
  color:var(--accent-ink);font-family:var(--serif);font-weight:700;font-size:16px;
  display:grid;place-items:center;letter-spacing:-.02em;
}
.brand .tt{min-width:0}
.brand h1{
  font-family:var(--serif);font-size:18px;font-weight:600;margin:0;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand .sub{font-size:10.5px;color:var(--ink-3);white-space:nowrap;letter-spacing:.03em}
@media(max-width:900px){.brand .sub{display:none}}
@media(max-width:640px){.brand h1{max-width:120px}}

.bar-sp{flex:1 1 auto}

.srch{position:relative;flex:0 1 250px}
.srch input{
  width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface-2);
}
.srch input::placeholder{color:var(--ink-3)}
.srch .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:flex}
.sugg{
  position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:330px;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow-3);padding:5px;z-index:60;
}
.sugg button{
  display:flex;width:100%;gap:9px;align-items:baseline;padding:6px 8px;border-radius:7px;text-align:left;
}
.sugg button:hover,.sugg button.on{background:var(--surface-2)}
.sugg .s-n{font-family:var(--serif);font-size:14px;font-weight:600}
.sugg .s-y{font-size:11px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.sugg .empty{padding:10px;color:var(--ink-3);font-size:13px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:500;
  white-space:nowrap;transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:var(--surface);border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn.icon{padding:7px 8px}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .cnt{
  min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--accent);
  color:var(--accent-ink);font-size:10px;font-weight:700;display:grid;place-items:center;
}
@media(max-width:720px){.btn .lb{display:none}.btn{padding:7px 8px}}

/* ================= stage ================= */
#stage{
  flex:1 1 auto;position:relative;overflow:hidden;cursor:grab;
  touch-action:none;background:var(--bg);
}
#stage.drag{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#rails{position:absolute;left:0;top:0;pointer-events:none}
.rail{position:absolute;height:0;border-top:1px dashed var(--line)}
.rail b{
  position:absolute;left:0;top:-8px;background:var(--bg);padding:0 12px 0 0;
  font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);
}

/* ================= card ================= */
.card{
  position:absolute;width:150px;height:168px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-1);
  display:flex;flex-direction:column;align-items:center;
  padding:13px 9px 11px;text-align:center;cursor:pointer;
  transition:box-shadow .15s,border-color .15s,transform .15s,opacity .18s;
}
.card:hover{box-shadow:var(--shadow-2);border-color:var(--gold-line);transform:translateY(-2px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-2)}
.card.dim{opacity:.2}
.card.hit{animation:pulse 1.2s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}55%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* Vòng quanh ảnh chỉ làm một việc: báo giới tính. Kể cả người đã mất. */
.ava{
  width:62px;height:62px;border-radius:50%;flex:0 0 auto;position:relative;
  background:var(--surface-2);display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ring,var(--ink-3));
}
.ava .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava .ini{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ring,var(--ink-3))}
/* Ký hiệu giới tính, để người khó phân biệt màu vẫn đọc được */
.ava .sex{
  position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;
  background:var(--ring,var(--ink-3));color:#fff;
  display:grid;place-items:center;font-size:10px;line-height:1;
  box-shadow:0 0 0 2px var(--surface);
}
.card.gone .ava .ph img{filter:grayscale(1) contrast(.92) opacity(.85)}

.card .nm{
  font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.22;
  margin-top:10px;letter-spacing:-.005em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card .yr{
  font-size:12px;color:var(--ink-2);margin-top:auto;padding-top:5px;
  font-variant-numeric:tabular-nums;
}
.card .rl{
  font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);
  font-weight:600;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* Đã mất: đổi nền, thêm dải tang ở đáy, năm mất in đậm kèm chữ thập.
   Không đụng tới vòng giới tính. */
.card.gone{
  background:var(--surface-gone);
  border-bottom:3px solid var(--gold);
  padding-bottom:8px;
}
.card.gone .nm{color:var(--ink-2)}
.card.gone .yr{color:var(--gold);font-weight:600}
.card.gone .yr .cross{margin-right:3px}

/* ================= floating controls ================= */
.zoom{
  position:absolute;left:14px;bottom:14px;z-index:20;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow-2);overflow:hidden;
}
.zoom button{width:34px;height:32px;display:grid;place-items:center;color:var(--ink-2)}
.zoom button:hover{background:var(--surface-2);color:var(--ink)}
.zoom button+button{border-top:1px solid var(--line-2)}
.legend{
  position:absolute;right:14px;bottom:14px;z-index:20;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow-2);padding:9px 11px;display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);
}
.legend i{display:inline-block;margin-right:5px;vertical-align:middle}
.legend i.dot{width:10px;height:10px;border-radius:50%}
.legend i.band{width:16px;height:10px;border-bottom:3px solid var(--gold);background:var(--surface-gone)}
@media(max-width:640px){.legend{display:none}}

/* ================= drawer ================= */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;z-index:50;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-3);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;
}
.drawer.open{transform:none}
.drawer .dh{
  display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.drawer .dh h2{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0}
.drawer .db{flex:1 1 auto;overflow:auto;padding:18px 16px 22px}
.drawer .df{flex:0 0 auto;padding:11px 13px;border-top:1px solid var(--line);display:flex;gap:8px}
.x{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.x:hover{background:var(--surface-2);color:var(--ink)}

.prof{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:14px}
.prof .pav{
  width:112px;height:112px;border-radius:50%;background:var(--surface-2);position:relative;
  display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ring,var(--ink-3)),var(--shadow-2);
}
.prof .pav .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.prof .pav img{width:100%;height:100%;object-fit:cover}
.prof .pav .ini{font-family:var(--serif);font-size:40px;font-weight:600;color:var(--ring,var(--ink-3))}
.prof .pav .sex{
  position:absolute;right:2px;bottom:2px;width:28px;height:28px;border-radius:50%;
  background:var(--ring,var(--ink-3));color:#fff;display:grid;place-items:center;
  font-size:16px;line-height:1;box-shadow:0 0 0 3px var(--surface);
}
.prof.gone .pav .ph img{filter:grayscale(1) opacity(.85)}
.prof h3{font-family:var(--serif);font-size:24px;font-weight:600;margin:14px 0 0;line-height:1.2;text-wrap:balance}
.prof .alias{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:14px;margin-top:2px}
.prof .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.tag{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
}
.tag.gold{color:var(--gold);border-color:var(--gold-line)}
.tag.live{color:var(--ok);border-color:var(--ok)}
.tag.gone{color:var(--gold);border-color:var(--gold);font-weight:700;background:var(--surface-gone)}

.rule{height:1px;background:var(--line);margin:16px 0;position:relative}
.rule b{
  position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--surface);
  padding:0 10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;
}

dl.facts{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;margin:0}
dl.facts dt{font-size:12px;color:var(--ink-3)}
dl.facts dd{margin:0;font-size:13.5px;font-variant-numeric:tabular-nums}
dl.facts dd .cc{color:var(--gold);font-family:var(--serif);font-style:italic}
dl.facts dd.note{font-size:13px;color:var(--ink-2);line-height:1.55;grid-column:1/-1}

.rel{display:flex;flex-direction:column;gap:9px}
.rel .rg{display:flex;gap:9px;align-items:flex-start}
.rel .rl2{font-size:12px;color:var(--ink-3);flex:0 0 96px;padding-top:5px}
.rel .chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:20px;
  border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:500;
}
.chip:hover{border-color:var(--accent);background:var(--surface)}
.chip i{
  width:20px;height:20px;border-radius:50%;overflow:hidden;background:var(--bg);display:grid;place-items:center;
  font-size:10px;font-style:normal;font-weight:700;color:var(--ring,var(--ink-3));flex:0 0 auto;
}
.chip i img{width:100%;height:100%;object-fit:cover}
.muted{color:var(--ink-3);font-size:13px}

/* ================= panel (giỗ / thống kê) ================= */
.pop{
  position:absolute;top:calc(100% + 8px);right:0;width:330px;max-width:calc(100vw - 24px);
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow-3);z-index:70;overflow:hidden;
}
.pop .ph{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pop .ph h3{font-family:var(--serif);font-size:15px;margin:0;font-weight:600}
.pop .ph .sm2{font-size:11px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.pop .pb{max-height:340px;overflow:auto;padding:6px}
.gio{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;text-align:left}
.gio:hover{background:var(--surface-2)}
.gio .gd{
  flex:0 0 auto;width:44px;text-align:center;border:1px solid var(--gold-line);border-radius:7px;
  padding:3px 0;line-height:1.1;
}
.gio .gd b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.gio .gd s{display:block;font-size:9px;text-decoration:none;color:var(--gold);letter-spacing:.06em}
.gio .gn{flex:1 1 auto;min-width:0}
.gio .gn b{display:block;font-family:var(--serif);font-size:14px;font-weight:600}
.gio .gn s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3)}
.gio .gw{flex:0 0 auto;font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
.gio.far .gw{color:var(--ink-3)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stats div{background:var(--surface);padding:11px 13px}
.stats b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stats s{display:block;text-decoration:none;font-size:11px;color:var(--ink-3);margin-top:2px}

/* ================= modal ================= */
.scrim{position:fixed;inset:0;background:rgba(28,18,12,.45);z-index:80;display:grid;place-items:center;padding:16px}
.modal{
  width:100%;max-width:520px;max-height:min(88vh,760px);background:var(--surface);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-3);
  display:flex;flex-direction:column;overflow:hidden;
}
.modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h2{font-family:var(--serif);font-size:19px;margin:0;font-weight:600}
.modal .mb{padding:18px;overflow:auto;flex:1 1 auto}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.modal .mf .sp{flex:1 1 auto}

.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld .hint{font-weight:400;color:var(--ink-3);font-size:11px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
}
.fld textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;gap:6px}
.seg button{
  flex:1 1 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  font-size:13px;font-weight:500;
}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.photo-row{display:flex;gap:12px;align-items:center}
.photo-row .pv{
  width:70px;height:70px;border-radius:50%;overflow:hidden;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:var(--ink-3);
}
.photo-row .pv img{width:100%;height:100%;object-fit:cover}
.photo-row .pa{flex:1 1 auto;display:flex;flex-direction:column;gap:6px}

.steps{counter-reset:s;display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:11px}
.steps li::before{
  counter-increment:s;content:counter(s);flex:0 0 auto;
  width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px;
}
.steps b{display:block;font-weight:600;font-size:13.5px}
.steps p{margin:2px 0 0;font-size:13px;color:var(--ink-2);line-height:1.55}
.steps code{
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;font-size:12px;word-break:break-all;
}

/* ================= misc ================= */
.banner{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2);
  position:relative;z-index:25;
}
.banner b{color:var(--ink)}
.banner .bsp{flex:1 1 auto}

.empty{

<script>
"use strict";
/* =====================================================================
   GIA PHẢ VIỆT — cây gia phả trực tuyến, một file, không cần server.
   Nguồn dữ liệu: Google Sheets (CSV) · data.csv cùng thư mục · hoặc

/* ---------- cấu hình: sửa 2 dòng dưới nếu muốn gắn cứng Google Sheet ---------- */
var CONFIG = {
  sheetId:  "",          // ví dụ "1AbCdEf...": lấy trong URL Google Sheet
  sheetName:"GiaPha",    // tên tab trong Sheet
  title:    ""           // ví dụ "Gia phả họ Nguyễn"; để trống sẽ tự suy ra

var PREVIEW = false;

/* ================== tiện ích ================== */
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function bare(s){
  return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
}
function key(s){ return bare(s).replace(/[^a-z0-9]/g,""); }
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); },2600);
}
function initials(name){
  var p=String(name||"").trim().split(/\s+/);
  if(!p.length||!p[0]) return "?";
  return (p[p.length-1][0]||"?").toUpperCase();
}

/* ================== âm lịch Việt Nam (thuật toán Hồ Ngọc Đức) ================== */
var TZ = 7;
function jdFromDate(dd,mm,yy){
  var a=Math.floor((14-mm)/12), y=yy+4800-a, m=mm+12*a-3;
  var jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;
  if(jd<2299161) jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;
  return jd;
}
function jdToDate(jd){
  var a,b,c,d,e,m;
  if(jd>2299160){ a=jd+32044; b=Math.floor((4*a+3)/146097); c=a-Math.floor((b*146097)/4); }
  else { b=0; c=jd+32082; }
  d=Math.floor((4*c+3)/1461); e=c-Math.floor((1461*d)/4); m=Math.floor((5*e+2)/153);
  var day=e-Math.floor((153*m+2)/5)+1;
  var month=m+3-12*Math.floor(m/10);
  var year=b*100+d-4800+Math.floor(m/10);
  return [day,month,year];
}
function newMoon(k){
  var T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;
  var J=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
  J=J+0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
  var M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
  var Mp=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
  var F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  var C=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);
  C=C-0.4068*Math.sin(Mp*dr)+0.0161*Math.sin(dr*2*Mp);
  C=C-0.0004*Math.sin(dr*3*Mp)+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mp));
  C=C-0.0074*Math.sin(dr*(M-Mp))+0.0004*Math.sin(dr*(2*F+M));
  C=C-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mp));
  C=C+0.0010*Math.sin(dr*(2*F-Mp))+0.0005*Math.sin(dr*(2*Mp+M));
  var dt = (T<-11) ? (0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3)
                   : (-0.000278+0.000265*T+0.000262*T2);
  return J+C-dt;
}
function sunLong(jdn){
  var T=(jdn-2451545.0)/36525,T2=T*T,dr=Math.PI/180;
  var M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  var L0=280.46645+36000.76983*T+0.0003032*T2;
  var DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);
  DL=DL+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);
  var L=(L0+DL)*dr;
  return L-Math.PI*2*Math.floor(L/(Math.PI*2));
}
function sunLongIdx(dayNumber){ return Math.floor(sunLong(dayNumber-0.5-TZ/24)/Math.PI*6); }
function newMoonDay(k){ return Math.floor(newMoon(k)+0.5+TZ/24); }
function lunarMonth11(yy){
  var off=jdFromDate(31,12,yy)-2415021, k=Math.floor(off/29.530588853), nm=newMoonDay(k);
  if(sunLongIdx(nm)>=9) nm=newMoonDay(k-1);
  return nm;
}
function leapMonthOffset(a11){
  var k=Math.floor((a11-2415021.076998695)/29.530588853+0.5), last=0, i=1;
  var arc=sunLongIdx(newMoonDay(k+i));
  do{ last=arc; i++; arc=sunLongIdx(newMoonDay(k+i)); } while(arc!==last && i<14);
  return i-1;
}
function solar2lunar(dd,mm,yy){
  var dn=jdFromDate(dd,mm,yy);
  var k=Math.floor((dn-2415021.076998695)/29.530588853);
  var ms=newMoonDay(k+1); if(ms>dn) ms=newMoonDay(k);
  var a11=lunarMonth11(yy), b11=a11, ly;
  if(a11>=ms){ ly=yy; a11=lunarMonth11(yy-1); } else { ly=yy+1; b11=lunarMonth11(yy+1); }
  var ld=dn-ms+1, diff=Math.floor((ms-a11)/29), leap=0, lm=diff+11;
  if(b11-a11>365){
    var lo=leapMonthOffset(a11);
    if(diff>=lo){ lm=diff+10; if(diff===lo) leap=1; }
  }
  if(lm>12) lm-=12;
  if(lm>=11 && diff<4) ly-=1;
  return {d:ld,m:lm,y:ly,leap:leap};
}
function lunar2solar(ld,lm,ly,leap){
  var a11,b11;
  if(lm<11){ a11=lunarMonth11(ly-1); b11=lunarMonth11(ly); }
  else { a11=lunarMonth11(ly); b11=lunarMonth11(ly+1); }
  var off=lm-11; if(off<0) off+=12;
  if(b11-a11>365){
    var lo=leapMonthOffset(a11), lmn=lo-2; if(lmn<0) lmn+=12;
    if(leap && lm!==lmn) return null;
    if(leap || off>=lo) off+=1;
  }
  var k=Math.floor(0.5+(a11-2415021.076998695)/29.530588853);
  return jdToDate(newMoonDay(k+off)+ld-1); // [d,m,y]
}
var CAN=["Canh","Tân","Nhâm","Quý","Giáp","Ất","Bính","Đinh","Mậu","Kỷ"];
var CHI=["Thân","Dậu","Tuất","Hợi","Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi"];
function canChi(y){ if(!y) return ""; return CAN[y%10]+" "+CHI[y%12]; }

/* ================== phân tích ngày tháng ================== */
/* Chấp nhận: "1950" · "5/9/1950" · "05/09/1950" · "1950-09-05" */
function parseDate(v){
  var s=String(v==null?"":v).trim();
  if(!s) return null;
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return {d:+m[3],m:+m[2],y:+m[1],full:true};
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if(m) return {d:+m[1],m:+m[2],y:+m[3],full:true};
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})$/);           // chỉ ngày-tháng (dùng cho ngày giỗ)
  if(m) return {d:+m[1],m:+m[2],y:0,full:false};
  m=s.match(/(\d{3,4})/);
  if(m) return {d:0,m:0,y:+m[1],full:false};
  return null;
}
function fmtDate(o){
  if(!o) return "";
  if(o.full) return String(o.d).padStart(2,"0")+"/"+String(o.m).padStart(2,"0")+"/"+o.y;
  return o.y ? String(o.y) : (o.d+"/"+o.m);
}

/* ================== đọc CSV ================== */
function parseCSV(text){
  var rows=[],row=[],f="",i=0,q=false;
  text=String(text).replace(/^\uFEFF/,"");
  while(i<text.length){
    var c=text.charAt(i);
    if(q){
      if(c==='"'){ if(text.charAt(i+1)==='"'){ f+='"'; i+=2; continue; } q=false; i++; continue; }
      f+=c; i++; continue;
    }
    if(c==='"'){ q=true; i++; continue; }
    if(c===","){ row.push(f); f=""; i++; continue; }
    if(c==="\r"){ i++; continue; }
    if(c==="\n"){ row.push(f); f=""; rows.push(row); row=[]; i++; continue; }
    f+=c; i++;
  }
  row.push(f); rows.push(row);
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==""; }); });
}

var ALIAS={

function mapHeaders(head){
  var map={};
  head.forEach(function(h,i){
    var k=key(h);
    Object.keys(ALIAS).forEach(function(field){
      if(map[field]!=null) return;
      if(ALIAS[field].indexOf(k)>=0) map[field]=i;
    });
  });
  return map;
}
function idList(v){
  return String(v==null?"":v).split(/[,;|]/).map(function(s){ return s.trim(); }).filter(Boolean);
}
function rowsToPeople(rows){
  if(!rows.length) return [];
  var map=mapHeaders(rows[0]);
  if(map.name==null) throw new Error("Không tìm thấy cột họ tên. Bảng cần có cột “ho_ten”.");
  var out=[],auto=0;
  for(var r=1;r<rows.length;r++){
    var row=rows[r];
    var g=function(f){ return map[f]==null?"":String(row[map[f]]==null?"":row[map[f]]).trim(); };
    var name=g("name"); if(!name) continue;
    auto++;
    var np=normalize({
      id:g("id")||("r"+auto), name:name, alias:g("alias"), gender:g("gender"),
      birth:g("birth"), death:g("death"), gio:g("gio"), photo:g("photo"),
      father:g("father"), mother:g("mother"), spouse:idList(g("spouse")),
      gen:g("gen"), origin:g("origin"), burial:g("burial"), role:g("role"), note:g("note")
    });
    np._row=r+1;
    out.push(np);
  }
  return out;
}

/* ---- chuẩn hoá một người ---- */
function normalize(p){
  var o={
    id:String(p.id||"").trim(),
    name:String(p.name||"").trim(),
    alias:String(p.alias||"").trim(),
    gender:"",
    birth:String(p.birth||"").trim(),
    death:String(p.death||"").trim(),
    gio:String(p.gio||"").trim(),
    photo:String(p.photo||"").trim(),
    father:String(p.father||"").trim(),
    mother:String(p.mother||"").trim(),
    spouse:Array.isArray(p.spouse)?p.spouse.slice():idList(p.spouse),
    gen:String(p.gen||"").trim(),
    origin:String(p.origin||"").trim(),
    burial:String(p.burial||"").trim(),
    role:String(p.role||"").trim(),
    note:String(p.note||"").trim()
  };
  var gk=key(p.gender);
  if(gk==="nam"||gk==="m"||gk==="male"||gk==="trai"||gk==="ong"||gk==="1") o.gender="Nam";
  else if(gk==="nu"||gk==="f"||gk==="female"||gk==="gai"||gk==="ba"||gk==="0"||gk==="2") o.gender="Nữ";
  o.photo=fixPhoto(o.photo);
  o.bd=parseDate(o.birth);
  o.dd=parseDate(o.death);
  o.dead=!!(o.death && o.dd);
  o.giod=parseDate(o.gio);
  if(!o.giod && o.dd && o.dd.full){
    var L=solar2lunar(o.dd.d,o.dd.m,o.dd.y);
    o.giod={d:L.d,m:L.m,y:0,full:false}; o.gioAuto=true;
  }
  return o;
}
/* Link Google Drive -> ảnh hiển thị được */
function fixPhoto(u){
  if(!u) return "";
  var m=u.match(/drive\.google\.com\/file\/d\/([-\w]{10,})/) || u.match(/drive\.google\.com\/open\?id=([-\w]{10,})/) || u.match(/[?&]id=([-\w]{10,})/);
  if(m) return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w400";
  return u;
}

var CARD_W=150, CARD_H=168, SIB_GAP=26, SP_GAP=14, GEN_GAP=104, ROOT_GAP=90;
var ROW=CARD_H+GEN_GAP;

var State={
  people:[], byId:new Map(), kids:new Map(), sp:new Map(),
  blocks:[], pos:new Map(), bbox:{w:0,h:0}, maxDepth:0, genBase:1,
  source:"demo", sheetId:"", sheetName:"", sheetUrl:"",

/* ================== dựng chỉ mục quan hệ ================== */
function buildIndex(){
  var S=State;
  S.byId=new Map(); S.kids=new Map(); S.sp=new Map();
  S.people.forEach(function(p){ S.byId.set(p.id,p); S.sp.set(p.id,new Set()); S.kids.set(p.id,[]); });
  S.people.forEach(function(p){
    if(p.father && !S.byId.has(p.father)) p.father="";
    if(p.mother && !S.byId.has(p.mother)) p.mother="";
    p.spouse=p.spouse.filter(function(s){ return S.byId.has(s) && s!==p.id; });
  });
  S.people.forEach(function(p){
    [p.father,p.mother].forEach(function(pid){
      if(!pid) return;
      var a=S.kids.get(pid);
      if(a.indexOf(p.id)<0) a.push(p.id);
    });
    p.spouse.forEach(function(s){ S.sp.get(p.id).add(s); S.sp.get(s).add(p.id); });
    if(p.father && p.mother){ S.sp.get(p.father).add(p.mother); S.sp.get(p.mother).add(p.father); }
  });
  var byBirth=function(a,b){
    var pa=S.byId.get(a), pb=S.byId.get(b);
    var ya=pa.bd&&pa.bd.y?pa.bd.y:9999, yb=pb.bd&&pb.bd.y?pb.bd.y:9999;
    if(ya!==yb) return ya-yb;
    return S.people.indexOf(pa)-S.people.indexOf(pb);
  };
  S.kids.forEach(function(a){ a.sort(byBirth); });
}

/* ================== bố cục cây ================== */
function computeLayout(){
  var S=State, visited=new Set();
  var roots=S.people.filter(function(p){ return !p.father && !p.mother; });
  roots.sort(function(a,b){
    var da=descCount(a.id), db=descCount(b.id);
    if(da!==db) return db-da;
    if((a.gender==="Nam")!==(b.gender==="Nam")) return a.gender==="Nam"?-1:1;
    var ya=a.bd&&a.bd.y?a.bd.y:9999, yb=b.bd&&b.bd.y?b.bd.y:9999;
    return ya-yb;
  });
  var blocks=[];
  roots.forEach(function(r){ if(!visited.has(r.id)) blocks.push(unit(r.id,0,visited)); });
  S.people.forEach(function(p){ if(!visited.has(p.id)) blocks.push(unit(p.id,0,visited)); });

  var x=0, maxD=0;
  blocks.forEach(function(b){ place(b,x); x+=b.w+ROOT_GAP; });
  S.pos=new Map();
  (function walk(bs){ bs.forEach(function(b){ maxD=Math.max(maxD,b.depth); collect(b); walk(b.kids); }); })(blocks);

  S.blocks=blocks; S.maxDepth=maxD;
  S.bbox={ w:Math.max(0,x-ROOT_GAP), h:(maxD+1)*ROW-GEN_GAP };

  var rootGen=parseInt((S.byId.get(blocks.length?blocks[0].id:"")||{}).gen,10);
  S.genBase=(rootGen>0?rootGen:1);

  function collect(b){
    S.pos.set(b.id,{x:b.ownX,y:b.y,block:b});
    b.sps.forEach(function(s,i){
      S.pos.set(s,{x:b.ownX+(i+1)*(CARD_W+SP_GAP),y:b.y,block:b,spouseOf:b.id});
    });
  }

  function descCount(id,seen){
    seen=seen||new Set(); if(seen.has(id)) return 0; seen.add(id);
    return (S.kids.get(id)||[]).reduce(function(n,k){ return n+1+descCount(k,seen); },0);
  }

  function unit(id,depth,vis){
    vis.add(id);
    var sps=Array.from(S.sp.get(id)||[]).filter(function(s){ return !vis.has(s); });
    sps.sort(function(a,b){
      var pa=S.byId.get(a), pb=S.byId.get(b);
      return ((pa.bd&&pa.bd.y)||9999)-((pb.bd&&pb.bd.y)||9999);
    });
    sps.forEach(function(s){ vis.add(s); });

    var order=(S.kids.get(id)||[]).slice().sort(function(a,b){
      var ga=grp(a), gb=grp(b);
      if(ga!==gb) return ga-gb;
      var pa=S.byId.get(a), pb=S.byId.get(b);
      return ((pa.bd&&pa.bd.y)||9999)-((pb.bd&&pb.bd.y)||9999);
    });
    function grp(kid){
      var p=S.byId.get(kid);
      var other=(p.father===id)?p.mother:p.father;
      var i=sps.indexOf(other);
      return i<0?sps.length:i;
    }

    var kidBlocks=[];
    order.forEach(function(k){
      if(vis.has(k)) return;
      var kb=unit(k,depth+1,vis);
      kb.groupIdx=grp(k);
      kidBlocks.push(kb);
    });

    var ownW=CARD_W*(1+sps.length)+SP_GAP*sps.length;
    var kidsW=kidBlocks.reduce(function(a,b){ return a+b.w; },0)+Math.max(0,kidBlocks.length-1)*SIB_GAP;
    return {id:id,sps:sps,kids:kidBlocks,depth:depth,ownW:ownW,kidsW:kidsW,w:Math.max(ownW,kidsW)};
  }

  function place(b,x0){
    b.x=x0; b.y=b.depth*ROW;
    b.ownX=x0+(b.w-b.ownW)/2;
    var cx=x0+(b.w-b.kidsW)/2;
    b.kids.forEach(function(k){ place(k,cx); cx+=k.w+SIB_GAP; });
  }
}

/* ================== vẽ ================== */
function render(){
  computeLayout();
  var S=State;
  var cards=$("#cards"), links=$("#links"), rails=$("#rails");
  cards.innerHTML=""; rails.innerHTML="";

  var W=Math.max(S.bbox.w,1), H=Math.max(S.bbox.h,1);
  links.setAttribute("width",W); links.setAttribute("height",H);
  links.setAttribute("viewBox","0 0 "+W+" "+H);

  /* thanh ngang phân đời */
  for(var d=0;d<=S.maxDepth;d++){
    var r=el("div","rail");
    r.style.top=(d*ROW-30)+"px";
    r.style.width=W+"px";
    var b=el("b","","Đời "+toRoman(S.genBase+d));
    r.appendChild(b);
    rails.appendChild(r);
  }

  /* đường nối */
  var d1="",d2="";
  (function walk(bs){
    bs.forEach(function(b){
      var ax=b.ownX+CARD_W/2, ay=b.y;
      var mY=ay+CARD_H*0.44;

      b.sps.forEach(function(s,i){
        var sx=b.ownX+(i+1)*(CARD_W+SP_GAP);
        d2+="M"+(sx-SP_GAP)+" "+mY+"H"+sx+" ";
      });

      var groups={};
      b.kids.forEach(function(k){
        var gi=(k.groupIdx==null?b.sps.length:k.groupIdx);
        (groups[gi]=groups[gi]||[]).push(k);
      });
      Object.keys(groups).forEach(function(gk,gi){
        var list=groups[gk], idx=parseInt(gk,10);
        var fromX=ax, fromY=ay+CARD_H;
        if(idx<b.sps.length){
          /* điểm rơi nằm đúng khe giữa hai vợ chồng, không cắt ngang thẻ nào */
          fromX=b.ownX+idx*(CARD_W+SP_GAP)+CARD_W+SP_GAP/2; fromY=mY;
        }
        var busY=(b.depth+1)*ROW-GEN_GAP/2+gi*7;
        var xs=list.map(function(k){ return k.ownX+CARD_W/2; });
        var lo=Math.min.apply(null,xs), hi=Math.max.apply(null,xs);
        d1+="M"+fromX+" "+fromY+"V"+busY+" ";
        d1+="M"+lo+" "+busY+"H"+hi+" ";
        xs.forEach(function(cx){ d1+="M"+cx+" "+busY+"V"+((b.depth+1)*ROW)+" "; });
      });
      walk(b.kids);
    });
  })(S.blocks);

  links.innerHTML=
    '<path d="'+d1+'" style="fill:none;stroke:var(--gold-line);stroke-width:1.4;stroke-linecap:round"/>'+
    '<path d="'+d2+'" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;opacity:.55"/>';

  /* thẻ người */
  var frag=document.createDocumentFragment();
  S.pos.forEach(function(pos,id){
    var p=S.byId.get(id); if(!p) return;
    frag.appendChild(cardEl(p,pos));
  });
  cards.appendChild(frag);

  $("#stage .empty") && $("#stage .empty").remove();
  if(!S.people.length) showEmpty();
  updateChrome();
}

function toRoman(n){
  var v=[10,9,5,4,1], s=["X","IX","V","IV","I"], out="";
  if(n>39||n<1) return String(n);
  for(var i=0;i<v.length;i++){ while(n>=v[i]){ out+=s[i]; n-=v[i]; } }
  return out;
}

/* ================== khung nhìn: kéo & thu phóng ================== */
function applyT(){
  var t=State.t, s="translate("+t.x+"px,"+t.y+"px) scale("+t.k+")";
  $("#canvas").style.transform=s;
  $("#rails").style.transform=s;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function fitView(anim){
  var st=$("#stage"), W=st.clientWidth, H=st.clientHeight;
  var bw=Math.max(State.bbox.w,1), bh=Math.max(State.bbox.h,1)+60;
  var k=clamp(Math.min((W-80)/bw,(H-100)/bh),0.12,1.1);
  State.t.k=k;
  State.t.x=(W-bw*k)/2;
  State.t.y=(H-bh*k)/2+40*k;
  if(anim) $("#canvas").style.transition=$("#rails").style.transition="transform .3s ease";
  applyT();
  if(anim) setTimeout(function(){ $("#canvas").style.transition=$("#rails").style.transition=""; },320);
}
function centerOn(id,zoom){
  var pos=State.pos.get(id); if(!pos) return;
  var st=$("#stage"), t=State.t;
  if(zoom) t.k=clamp(Math.max(t.k,0.75),0.12,2.5);
  t.x=st.clientWidth/2-(pos.x+CARD_W/2)*t.k;
  t.y=st.clientHeight/2-(pos.y+CARD_H/2)*t.k;
  $("#canvas").style.transition=$("#rails").style.transition="transform .32s ease";
  applyT();
  setTimeout(function(){ $("#canvas").style.transition=$("#rails").style.transition=""; },340);
}
function zoomBy(f,cx,cy){
  var st=$("#stage"), t=State.t;
  cx=cx==null?st.clientWidth/2:cx; cy=cy==null?st.clientHeight/2:cy;
  var k2=clamp(t.k*f,0.12,2.5);
  t.x=cx-(cx-t.x)*(k2/t.k); t.y=cy-(cy-t.y)*(k2/t.k); t.k=k2;
  applyT();
}

function bindStage(){
  var st=$("#stage"), pts=new Map(), last=null, pinch=null, moved=0;

  st.addEventListener("pointerdown",function(e){
    if(e.target.closest(".zoom,.legend,.empty")) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    moved=0;
    if(pts.size===1){ last={x:e.clientX,y:e.clientY}; st.classList.add("drag"); }
    if(pts.size===2){ pinch=pinchState(pts); }
  });
  window.addEventListener("pointermove",function(e){
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){
      var now=pinchState(pts), r=st.getBoundingClientRect();
      zoomBy(now.d/pinch.d,now.x-r.left,now.y-r.top);
      State.t.x+=now.x-pinch.x; State.t.y+=now.y-pinch.y; applyT();
      pinch=now; return;
    }
    if(pts.size===1&&last){
      var dx=e.clientX-last.x, dy=e.clientY-last.y;
      moved+=Math.abs(dx)+Math.abs(dy);
      State.t.x+=dx; State.t.y+=dy; last={x:e.clientX,y:e.clientY}; applyT();
    }
  });
  function up(e){
    pts.delete(e.pointerId);
    if(pts.size<2) pinch=null;
    if(pts.size===0){ last=null; st.classList.remove("drag"); }
  }
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);

  st.addEventListener("wheel",function(e){
    e.preventDefault();
    var r=st.getBoundingClientRect();

      zoomBy(Math.exp(-e.deltaY*0.0016),e.clientX-r.left,e.clientY-r.top);
    } else { State.t.x-=e.deltaX; applyT(); }
  },{passive:false});

  $("#cards").addEventListener("click",function(e){

  }
}

  var set=new Set([id]), S=State;
  (function up(i){ var p=S.byId.get(i); if(!p) return;
    [p.father,p.mother].forEach(function(x){ if(x&&!set.has(x)){ set.add(x); up(x); } }); })(id);
  (function down(i){ (S.kids.get(i)||[]).forEach(function(k){ if(!set.has(k)){ set.add(k); down(k); } }); })(id);
  Array.from(set).forEach(function(i){ (S.sp.get(i)||new Set()).forEach(function(s){ set.add(s); }); });
  return set;
}

function bindSearch(){
  var q=$("#q"), box=$("#sugg"), idx=-1;
  function close(){ box.hidden=true; idx=-1; }
  function run(){
    var v=bare(q.value.trim());
    if(!v){ close(); return; }
    var hits=State.people.filter(function(p){
      return bare(p.name).indexOf(v)>=0 || bare(p.alias).indexOf(v)>=0 || (p.bd&&String(p.bd.y).indexOf(v)===0);
    }).slice(0,40);
    box.innerHTML="";
    if(!hits.length){ box.appendChild(el("div","empty","Không tìm thấy ai khớp “"+q.value.trim()+"”.")); box.hidden=false; return; }
    hits.forEach(function(p){
      var b=el("button");
      b.appendChild(el("span","s-n",p.name));
      b.appendChild(el("span","s-y",yearsText(p)));
      b.onclick=function(){ close(); q.blur(); select(p.id); };
      box.appendChild(b);
    });
    box.hidden=false; idx=-1;
  }
  q.addEventListener("input",run);
  q.addEventListener("focus",function(){ if(q.value.trim()) run(); });
  q.addEventListener("keydown",function(e){
    var bs=$$("button",box);
    if(e.key==="Escape"){ close(); q.blur(); return; }
    if(!bs.length) return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      idx=(idx+(e.key==="ArrowDown"?1:bs.length-1))%bs.length;
      bs.forEach(function(b,i){ b.classList.toggle("on",i===idx); });
      bs[idx].scrollIntoView({block:"nearest"});
    }
    if(e.key==="Enter"&&idx>=0){ e.preventDefault(); bs[idx].click(); }
  });
  document.addEventListener("click",function(e){ if(!e.target.closest(".srch")) close(); });
}

function upcomingGio(days){
  var now=new Date(), y=now.getFullYear();
  var today=jdFromDate(now.getDate(),now.getMonth()+1,y), out=[];
  State.people.forEach(function(p){
    if(!p.dead||!p.giod||!p.giod.d||!p.giod.m) return;
    for(var k=0;k<2;k++){
      var s=lunar2solar(p.giod.d,p.giod.m,y+k,0);
      if(!s||!s[2]) continue;
      var jd=jdFromDate(s[0],s[1],s[2]), diff=jd-today;
      if(diff>=0&&diff<=days){ out.push({p:p,jd:jd,s:s,diff:diff}); break; }
    }
  });
  out.sort(function(a,b){ return a.jd-b.jd; });
  return out;
}

var CHI_COLORS=["#B4522F","#3C6E8F","#6B7F3A","#8A5A9B","#B08420","#2F7F6E","#9B4A63","#5A6C8F"];
function computeBranches(){
  var S=State;
  S.chi=new Map(); S.chiList=[];
  if(!S.blocks.length) return;
  var rootId=S.blocks[0].id;
  var heads=(S.kids.get(rootId)||[]);
  if(!heads.length) return;
  heads.forEach(function(h,i){
    var p=S.byId.get(h);
    var info={id:h,name:p.name,color:CHI_COLORS[i%CHI_COLORS.length],count:0};
    S.chiList.push(info);
    (function down(x){
      if(S.chi.has(x)) return;
      S.chi.set(x,info); info.count++;
      (S.sp.get(x)||new Set()).forEach(function(s){ if(!S.chi.has(s)){ S.chi.set(s,info); info.count++; } });
      (S.kids.get(x)||[]).forEach(down);
    })(h);
  });
}
function paintChi(){
  $$("#cards .card").forEach(function(c){
    var info=State.chi&&State.chi.get(c.dataset.id);
    c.style.setProperty("--chi",info?info.color:"transparent");
    c.classList.toggle("haschi",!!info);
  });
}

/* Tổ tiên: đi ngược lên theo cha và mẹ. */
function ancestorHas(id,root){
  var seen=new Set(), stack=[String(id)];
  while(stack.length){
    var x=stack.pop();
    if(!x||seen.has(x)) continue;
    seen.add(x);
    if(x===root) return true;
    var p=State.byId.get(x);
    if(!p) continue;
    if(p.father) stack.push(p.father);
    if(p.mother) stack.push(p.mother);
  }
  return false;
}
/* Thuộc nhánh nếu là con cháu của gốc nhánh, hoặc là vợ/chồng của người trong nhánh. */
function inBranch(id,root){
  if(ancestorHas(id,root)) return true;
  var ok=false;
  (State.sp.get(id)||new Set()).forEach(function(s){ if(!ok&&ancestorHas(s,root)) ok=true; });
  return ok;
}
function canEdit(id){
  if(!Api.on||!loggedIn()) return false;
  if(isAdmin()) return true;
  if(Session.role!=="bien_tap") return false;
  return Session.branches.some(function(r){ return inBranch(id,r); });
}
function branchNames(){
  return Session.branches.map(function(r){
    var p=State.byId.get(r);
    return p?p.name:r;
  });
}

function setBanner(html,actions){
  var b=$("#banner");
  if(!html){ b.hidden=true; b.innerHTML=""; return; }
  b.innerHTML='<span>'+html+'</span><span class="bsp"></span>';
  (actions||[]).forEach(function(a){

  });

function sheetCsvUrl(id,name){
  return "https://docs.google.com/spreadsheets/d/"+encodeURIComponent(id)+
         "/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(name||"GiaPha");
}
function loadSheet(id,name){
  setBanner("Đang tải gia phả từ Google Sheet…");
  return fetch(sheetCsvUrl(id,name),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(txt){
      if(/^\s*</.test(txt)) throw new Error("Sheet chưa được chia sẻ công khai.");
      var rows=parseCSV(txt), people=rowsToPeople(rows);
      State.sheetId=id; State.sheetName=name;
      State.sheetUrl="https://docs.google.com/spreadsheets/d/"+id+"/edit";
      setPeople(people,"sheet");
      setBanner("");
    })
    .catch(function(err){
      setBanner("Không đọc được Google Sheet. "+esc(err.message)+" Hãy đặt quyền chia sẻ thành <b>Bất kỳ ai có đường liên kết · Người xem</b>.",
        [{label:"Mở cài đặt",pri:true,fn:openSetup}]);
    });
}
function loadScript(){
  setBanner("Đang tải gia phả…");
  return Api.list().then(function(j){
    var people=(j.rows||[]).map(function(r){ var o=normalize(r); o._row=r._row; return o; });
    State.sheetUrl=j.sheetUrl||"";
    if(typeof j.needsSetup==="boolean") Session.needsSetup=j.needsSetup;
    if(j.account) setSession(j.account);
    else if(Api.token){ saveToken(""); setSession(null); }
    setPeople(people,"script");
    setBanner(loggedIn()||!Session.needsSetup?"":
      "Chưa có tài khoản nào. Hãy lập tài khoản quản trị đầu tiên để bắt đầu phân quyền cho cả nhà.",
      Session.needsSetup&&!loggedIn()?[{label:"Lập tài khoản quản trị",pri:true,fn:openLogin}]:[]);
  }).catch(function(err){
    setBanner("Không kết nối được cổng ghi: "+esc(err.message),[{label:"Mở cài đặt",pri:true,fn:openSetup}]);
  });
}

var CFGKEY="giapha.cfg.v1";

}
function saveCfg(c){

function applyTheme(mode){
  if(mode==="light"||mode==="dark") document.documentElement.setAttribute("data-theme",mode);
  else document.documentElement.removeAttribute("data-theme");
}

function modal(title,buildBody,buildFoot,wide){
  var host=$("#modalHost");
  host.innerHTML="";
  var scrim=el("div","scrim");
  var m=el("div","modal");
  if(wide) m.style.maxWidth="640px";
  var mh=el("div","mh"); mh.appendChild(el("h2","",title));
  var sp=el("div"); sp.style.flex="1"; mh.appendChild(sp);
  var x=el("button","x"); x.setAttribute("aria-label","Đóng");
  x.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>';
  x.onclick=close; mh.appendChild(x);
  var mb=el("div","mb"), mf=el("div","mf");
  m.appendChild(mh); m.appendChild(mb); m.appendChild(mf);
  scrim.appendChild(m); host.appendChild(scrim);
  scrim.addEventListener("mousedown",function(e){ if(e.target===scrim) close(); });
  buildBody(mb,close);
  buildFoot&&buildFoot(mf,close);
  function close(){ host.innerHTML=""; }
  return {close:close,body:mb,foot:mf};
}
function field(host,label,hint){

  if(hint){ var h=el("span","hint"," — "+hint); l.appendChild(h); }
  f.appendChild(l); host.appendChild(f); return f;
}

     ["Mở cổng ghi","Trong Sheet chọn Tiện ích mở rộng → Apps Script, dán toàn bộ file <code>apps-script.gs</code>, bấm Triển khai → Ứng dụng web, chọn <b>Bất kỳ ai</b>, rồi chép đường dẫn kết thúc bằng <code>/exec</code> vào ô đầu trang này."],
     ["Đưa web lên mạng","Tải thư mục này lên GitHub rồi bật GitHub Pages, hoặc kéo thả thư mục vào app.netlify.com/drop. Cả hai đều miễn phí."],
     ["Gửi link cho cả nhà","Ai mở link cũng thêm và sửa được, trên điện thoại lẫn máy tính. Ảnh chụp từ điện thoại tải thẳng lên Google Drive của bạn."],
     ["Yên tâm về sai sót","Mọi thay đổi đều nằm trong Google Sheet, vào Tệp → Lịch sử phiên bản là khôi phục được bản cũ."]
    ].forEach(function(s){

    b._validate=function(){
      var v=iScript.value.trim();
      if(!v) return "";
      if(/docs\.google\.com\/spreadsheets/i.test(v)){
        if(!iId.value.trim()) iId.value=extractId(v);
        iScript.value="";
        return "Ô trên cùng đang là địa chỉ file Google Sheet. Tôi đã chuyển nó xuống ô ID của Google Sheet, "+
               "chế độ đó chỉ xem chứ không sửa được. Muốn thêm và sửa ngay trên trang thì cần dựng Apps Script "+

               "Các bước nằm ở mục Cách dựng trong 15 phút phía dưới.";

      if(!/\/exec$/i.test(v.replace(/[?#].*$/,""))){
        return "Đường dẫn cổng ghi phải kết thúc bằng /exec. Nếu nó kết thúc bằng /dev thì đó là bản thử nghiệm, "+
               "chỉ mình bạn dùng được. Vào Triển khai rồi chép lại địa chỉ của bản triển khai.";
      }
      return "";
    };

    b._read=function(){
      return {
        scriptUrl:iScript.value.trim(),
        sheetId:extractId(iId.value.trim()), sheetName:iName.value.trim()||"GiaPha",
        title:iTitle.value.trim(), paste:iPaste.value.trim(), theme:cfg.theme||"auto"
      };
    };
  },function(mf,close){
    var reset=el("button","btn","Dùng dữ liệu mẫu");
    reset.onclick=function(){ saveCfg({theme:loadCfg().theme||"auto"}); close(); location.reload(); };
    mf.appendChild(reset);
    mf.appendChild(el("div","sp"));
    var cancel=el("button","btn","Đóng"); cancel.onclick=close; mf.appendChild(cancel);
    var ok=el("button","btn pri","Lưu & tải lại");
    ok.onclick=function(){
      var mb=$(".modal .mb");
      var msg=mb._validate();
      if(msg){ mb._err(msg); return; }
      mb._err("");
      saveCfg(mb._read()); close(); location.reload();
    };
    mf.appendChild(ok);
  },true);
}
function extractId(v){
  var m=String(v).match(/\/d\/([-\w]{20,})/);
  return m?m[1]:String(v).trim();
}

function openLogin(){
  var setup=Session.needsSetup;
  modal(setup?"Lập tài khoản quản trị":"Đăng nhập gia phả",function(b){
    if(setup){
      var note=el("div","fld");
      note.style.cssText="background:var(--accent-soft);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.55";
      note.textContent="Chưa có tài khoản nào trong hệ thống. Tài khoản đầu tiên sẽ là quản trị, có toàn quyền và là người cấp tài khoản cho những người còn lại.";
      b.appendChild(note);
    }
    var f=field(b,"Tên đăng nhập",setup?"không dấu, không khoảng trắng":"");
    var iU=el("input"); iU.autocapitalize="off"; iU.autocomplete="username"; iU.placeholder="trongnt"; f.appendChild(iU);

    var iN=null;
    if(setup){
      f=field(b,"Tên hiển thị");
      iN=el("input"); iN.placeholder="Nguyễn Trọng"; f.appendChild(iN);
    }

    f=field(b,"Mật khẩu",setup?"ít nhất 6 ký tự":"");
    var iP=el("input"); iP.type="password"; iP.autocomplete=setup?"new-password":"current-password"; f.appendChild(iP);

    var iP2=null;
    if(setup){
      f=field(b,"Nhập lại mật khẩu");
      iP2=el("input"); iP2.type="password"; iP2.autocomplete="new-password"; f.appendChild(iP2);
    }

    b._submit=function(done){
      var u=iU.value.trim(), p=iP.value;
      if(!u||!p){ toast("Chưa điền đủ tên đăng nhập và mật khẩu."); return; }
      if(setup&&p!==iP2.value){ toast("Hai lần nhập mật khẩu chưa khớp."); return; }
      var call=setup?Api.initAdmin(u,p,iN.value.trim()):Api.login(u,p);
      call.then(function(j){
        saveToken(j.token); setSession(j.account); Session.needsSetup=false;
        done(); toast("Chào "+Session.name+".");
        return loadScript();
      }).catch(function(e){ toast(e.message); done(true); });
    };
    b.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); $(".modal .mf .pri").click(); } });
    setTimeout(function(){ iU.focus(); },40);
  },function(mf,close){
    mf.appendChild(el("div","sp"));
    var c=el("button","btn","Hủy"); c.onclick=close; mf.appendChild(c);
    var ok=el("button","btn pri",setup?"Tạo tài khoản":"Đăng nhập");
    ok.onclick=function(){
      var label=setup?"Tạo tài khoản":"Đăng nhập";
      ok.disabled=true; ok.textContent="Đang xử lý…";
      /* Lượt gọi đầu tiên trong ngày phải chờ Google khởi động script. */
      var t1=setTimeout(function(){ ok.textContent="Google đang khởi động…"; },8000);
      var t2=setTimeout(function(){ ok.textContent="Vẫn đang chờ, đừng bấm lại…"; },25000);
      $(".modal .mb")._submit(function(keep){
        clearTimeout(t1); clearTimeout(t2);
        if(keep){ ok.disabled=false; ok.textContent=label; }
        else close();
      });
    };
    mf.appendChild(ok);
  });
}

function blankPerson(){
  return {id:"",name:"",alias:"",gender:"",birth:"",death:"",gio:"",photo:"",
          father:"",mother:"",spouse:[],gen:"",origin:"",burial:"",role:"",note:""};
}
function resizeImage(file,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var s=Math.min(1,max/Math.max(img.width,img.height));
        var w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        var cx=cv.getContext("2d");
        cx.fillStyle="#fff"; cx.fillRect(0,0,w,h);
        cx.drawImage(img,0,0,w,h);
        res(cv.toDataURL("image/jpeg",0.82));
      };
      img.onerror=function(){ rej(new Error("Không đọc được ảnh.")); };
      img.src=fr.result;
    };
    fr.onerror=function(){ rej(new Error("Không đọc được tệp.")); };
    fr.readAsDataURL(file);
  });
}

/* ---------- lọc danh sách chọn cha, mẹ, vợ chồng ---------- */
var MIN_PARENT_AGE=12;   // khoảng cách tối thiểu giữa hai đời
var MAX_SPOUSE_GAP=45;   // chênh lệch tuổi tối đa còn coi là hợp lý

function descendantsOf(id){
  var out=new Set();
  (function down(x){
    (State.kids.get(x)||[]).forEach(function(k){ if(!out.has(k)){ out.add(k); down(k); } });
  })(id);
  return out;
}
function ancestorsOf(id){
  var out=new Set(), stack=[id], seen=new Set();
  while(stack.length){
    var x=stack.pop();
    if(!x||seen.has(x)) continue;
    seen.add(x);
    var p=State.byId.get(x);
    if(!p) continue;
    [p.father,p.mother].forEach(function(a){ if(a&&!out.has(a)){ out.add(a); stack.push(a); } });
  }
  return out;
}
function siblingsOf(id){
  var out=new Set(), p=State.byId.get(id);
  if(!p||(!p.father&&!p.mother)) return out;
  State.people.forEach(function(o){
    if(o.id===id) return;
    if((p.father&&o.father===p.father)||(p.mother&&o.mother===p.mother)) out.add(o.id);
  });
  return out;
}
function birthYear(p){ return (p&&p.bd&&p.bd.y)?p.bd.y:0; }

/* Trả về hai nhóm: hợp lý, và phần còn lại vẫn chọn được nhưng khó xảy ra.
   Người tự làm tổ tiên của chính mình thì bị loại hẳn, vì đó là vòng lặp. */
function relCandidates(kind,ctx){
  var selfId=ctx.selfId||"", year=ctx.year||0, gender=ctx.gender||"";
  var banned=new Set(ctx.exclude||[]);
  if(selfId){
    banned.add(selfId);
    descendantsOf(selfId).forEach(function(x){ banned.add(x); });
    if(kind==="spouse"){
      ancestorsOf(selfId).forEach(function(x){ banned.add(x); });
      siblingsOf(selfId).forEach(function(x){ banned.add(x); });
    }
  }

  var fit=[], other=[];
  State.people.forEach(function(q){
    if(banned.has(q.id)) return;
    var y=birthYear(q), good=true;

    if(kind==="father") good=(q.gender!=="Nữ");
    else if(kind==="mother") good=(q.gender!=="Nam");
    else if(gender&&q.gender&&gender===q.gender) good=false;

    if(good&&year&&y){
      good=(kind==="spouse") ? Math.abs(y-year)<=MAX_SPOUSE_GAP : (y<=year-MIN_PARENT_AGE);
    }
    (good?fit:other).push(q);
  });

  var byName=function(a,b){ return bare(a.name).localeCompare(bare(b.name)); };
  if(kind==="spouse"){
    fit.sort(function(a,b){
      var da=(year&&birthYear(a))?Math.abs(birthYear(a)-year):9999;
      var db=(year&&birthYear(b))?Math.abs(birthYear(b)-year):9999;
      return da!==db ? da-db : byName(a,b);
    });
  } else {
    /* Đời gần nhất lên trước: người sinh muộn hơn thường là cha mẹ đúng. */
    fit.sort(function(a,b){
      var ya=birthYear(a), yb=birthYear(b);
      return ya!==yb ? yb-ya : byName(a,b);
    });
  }
  other.sort(byName);
  return {fit:fit,other:other};
}

/* Đổ dữ liệu vào một ô chọn, giữ nguyên giá trị đang có kể cả khi nó
   không còn hợp lý, để việc mở form ra không âm thầm xoá mất quan hệ cũ. */
function fillRelSelect(sel,kind,ctx,val){
  var c=relCandidates(kind,ctx);
  if(val&&State.byId.has(val)){
    var seen=c.fit.concat(c.other).some(function(q){ return q.id===val; });
    if(!seen) c.other.unshift(State.byId.get(val));
  }
  while(sel.childNodes.length) sel.removeChild(sel.childNodes[0]);
  sel.appendChild(new Option("— không rõ —",""));
  addGroup("Phù hợp",c.fit);
  addGroup("Ít khả năng",c.other);
  sel.value=val||"";

  function addGroup(label,list){
    if(!list.length) return;
    var g=el("optgroup");
    g.label=label+" ("+list.length+")";
    list.forEach(function(q){ g.appendChild(new Option(personLabel(q),q.id)); });
    sel.appendChild(g);
  }
}

        .then(function(){
          close(); toast(id?"Đã lưu.":"Đã thêm vào gia phả.");
          return loadScript().then(function(){ select(c.person.id,true); });
        })
        .catch(function(e){ ok.disabled=false; ok.textContent=id?"Lưu thay đổi":"Thêm vào gia phả"; toast("Không lưu được: "+e.message); });
    };
    mf.appendChild(ok);
  });
}

/* ================== xuất PDF ================== */
var PX_MM=25.4/96;           // 1 điểm ảnh ở 96dpi đổi ra milimét
var PAGE_CAP_MM=4800;        // giới hạn khổ trang mà tệp PDF chịu được
var Print={on:false,saved:null,savedSource:"",savedFilter:null};

function paperSize(id){
  return {a4:[297,210],a3:[420,297],a2:[594,420]}[id]||[297,210];
}
function branchSubset(rootId){
  var keep=new Set([rootId]);
  (function down(x){
    (State.kids.get(x)||[]).forEach(function(k){ if(!keep.has(k)){ keep.add(k); down(k); } });
  })(rootId);
  Array.from(keep).forEach(function(i){
    (State.sp.get(i)||new Set()).forEach(function(s){ keep.add(s); });
  });
  /* Chép ra bản riêng, vì buildIndex có xoá những mã cha mẹ trỏ ra ngoài
     danh sách. Sửa thẳng lên bản gốc là mất quan hệ thật. */
  return State.people
    .filter(function(p){ return keep.has(p.id); })
    .map(function(p){ return Object.assign({},p,{spouse:p.spouse.slice()}); });
}

function buildPrintHead(){
  var h=$("#printHead")||el("div"); h.id="printHead"; h.innerHTML="";
  h.appendChild(el("h1","",$("#famName").textContent));
  var m=el("div","meta");
  var now=new Date();
  var L=solar2lunar(now.getDate(),now.getMonth()+1,now.getFullYear());
  [["Thành viên",State.people.length],
   ["Số đời",State.maxDepth+1],
   ["Còn sống",State.people.filter(function(p){ return !p.dead; }).length],
   ["Ngày in",fmtDate({d:now.getDate(),m:now.getMonth()+1,y:now.getFullYear(),full:true})+
              " · "+L.d+"/"+L.m+" âm lịch"]
  ].forEach(function(pair){
    var s=el("span");
    s.appendChild(document.createTextNode(pair[0]+": "));
    s.appendChild(el("b","",String(pair[1])));
    m.appendChild(s);
  });
  h.appendChild(m);
  if(!h.parentNode) $("#app").insertBefore(h,$("#stage"));
  return h;
}

function buildPrintTable(){
  var t=$("#printTable")||el("div"); t.id="printTable";

  var rows=State.people.slice().sort(function(a,b){
    var pa=State.pos.get(a.id), pb=State.pos.get(b.id);
    var da=pa?pa.y:1e9, db=pb?pb.y:1e9;
    if(da!==db) return da-db;
    var ya=(a.bd&&a.bd.y)||9999, yb=(b.bd&&b.bd.y)||9999;
    return ya-yb;
  });

  var head=["Đời","Họ và tên","Giới","Sinh","Mất","Ngày giỗ","Cha","Mẹ","Vợ / chồng","Nơi sinh"];
  var html="<h2>Danh sách thành viên</h2>"+
           "<table><thead><tr>"+head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+"</tr></thead><tbody>";
  var nameOf=function(id){ var q=State.byId.get(id); return q?esc(q.name):""; };

  rows.forEach(function(p){
    var pos=State.pos.get(p.id);
    var doi=pos?toRoman(State.genBase+Math.round(pos.y/ROW)):"";
    html+="<tr>"+
      '<td class="gen">'+doi+"</td>"+
      '<td class="nm">'+esc(p.name)+(p.role?" <i>· "+esc(p.role)+"</i>":"")+"</td>"+
      "<td>"+esc(p.gender||"")+"</td>"+
      "<td>"+(p.bd?esc(fmtDate(p.bd)):"")+"</td>"+
      "<td>"+(p.dd?esc(fmtDate(p.dd)):"")+"</td>"+
      "<td>"+(p.giod?p.giod.d+"/"+p.giod.m+" ÂL":"")+"</td>"+
      "<td>"+nameOf(p.father)+"</td>"+
      "<td>"+nameOf(p.mother)+"</td>"+
      "<td>"+Array.from(State.sp.get(p.id)||[]).map(nameOf).filter(Boolean).join(", ")+"</td>"+
      "<td>"+esc(p.origin||"")+"</td>"+
    "</tr>";
  });
  t.innerHTML=html+"</tbody></table>";
  if(!t.parentNode) $("#app").appendChild(t);
  return t;
}

function setupPrint(o){
  o=o||{};
  if(Print.on) teardownPrint();
  Print.on=true;

  /* Cất trạng thái đang xem để trả lại nguyên vẹn sau khi in. */
  Print.saved=State.people;
  Print.savedSource=State.source;
  Print.savedFilter={chi:State.chiFilter,focus:State.focusLine,sel:State.sel,t:Object.assign({},State.t)};
  State.chiFilter=null; State.focusLine=false;

  if(o.branch&&State.byId.has(o.branch)) setPeople(branchSubset(o.branch),State.source);
  else { buildIndex(); render(); computeBranches(); paintChi(); paintFocus(); }

  var pad=24, headMm=18;
  var bw=State.bbox.w+pad*2, bh=State.bbox.h+50;
  var k=1, wmm, hmm, margin=10;

  if(o.mode==="fit"){
    var pg=paperSize(o.paper), pw=pg[0], ph=pg[1];
    var availW=(pw-margin*2)/PX_MM;
    var availH=(ph-margin*2-headMm)/PX_MM;
    k=Math.min(availW/bw,availH/bh,1.4);
    wmm=pw; hmm=ph;
  } else {
    wmm=bw*PX_MM+margin*2;
    hmm=bh*PX_MM+margin*2+headMm;
    if(wmm>PAGE_CAP_MM||hmm>PAGE_CAP_MM){
      var s=Math.min(PAGE_CAP_MM/wmm,PAGE_CAP_MM/hmm);
      k=s; wmm=(wmm-margin*2)*s+margin*2; hmm=(hmm-margin*2-headMm)*s+margin*2+headMm;
    }
  }

  var offX=pad*k, offY=40*k;
  var tr="translate("+offX+"px,"+offY+"px) scale("+k+")";
  $("#canvas").style.transform=tr;
  $("#rails").style.transform=tr;
  var st=$("#stage");
  st.style.width=(State.bbox.w*k+offX*2)+"px";
  st.style.height=(State.bbox.h*k+offY+20)+"px";

  buildPrintHead();
  if(o.table) buildPrintTable();
  else { var old=$("#printTable"); if(old) old.remove(); }

  var css=$("#printPage")||el("style");
  css.id="printPage";
  css.textContent="@page{size:"+wmm.toFixed(1)+"mm "+hmm.toFixed(1)+"mm;margin:"+margin+"mm}";
  if(!css.parentNode) document.body.appendChild(css);

  return {k:k,wmm:wmm,hmm:hmm};
}

function teardownPrint(){
  if(!Print.on) return;
  Print.on=false;
  var st=$("#stage"); st.style.width=""; st.style.height="";
  var h=$("#printHead"); if(h) h.remove();
  var t=$("#printTable"); if(t) t.remove();
  var c=$("#printPage"); if(c) c.remove();

  if(Print.saved){
    State.chiFilter=Print.savedFilter.chi;
    State.focusLine=Print.savedFilter.focus;
    setPeople(Print.saved,Print.savedSource);
    State.sel=Print.savedFilter.sel;
    State.t=Print.savedFilter.t;
    applyT(); paintFocus();
    Print.saved=null;
  }
}

function openPrint(){
  if(!State.people.length){ toast("Chưa có ai trong gia phả để in."); return; }

  var opts={mode:"one",paper:"a3",table:true,branch:""};
  modal("Xuất bản in hoặc PDF",function(b){
    var f=field(b,"Khổ trang");
    var seg=el("div","seg"); seg.style.flexWrap="wrap";
    [["one","Một trang lớn"],["fit","Vừa một khổ giấy"]].forEach(function(o){
      var bt=el("button","",o[1]);
      if(opts.mode===o[0]) bt.classList.add("on");
      bt.onclick=function(){
        opts.mode=o[0];
        $$("button",seg).forEach(function(x){ x.classList.remove("on"); });
        bt.classList.add("on");
        paperRow.hidden=(opts.mode!=="fit");
        note();
      };
      seg.appendChild(bt);
    });
    f.appendChild(seg);

    var paperRow=el("div"); paperRow.hidden=(opts.mode!=="fit"); b.appendChild(paperRow);
    f=field(paperRow,"Giấy","đều là khổ ngang");
    var seg2=el("div","seg");
    [["a4","A4"],["a3","A3"],["a2","A2"]].forEach(function(o){
      var bt=el("button","",o[1]);
      if(opts.paper===o[0]) bt.classList.add("on");
      bt.onclick=function(){
        opts.paper=o[0];
        $$("button",seg2).forEach(function(x){ x.classList.remove("on"); });
        bt.classList.add("on"); note();
      };
      seg2.appendChild(bt);
    });
    f.appendChild(seg2);

    f=field(b,"In toàn bộ hay một chi");
    var sel=el("select");
    sel.appendChild(new Option("Toàn bộ dòng họ ("+State.people.length+" người)",""));
    (State.chiList||[]).forEach(function(c){
      sel.appendChild(new Option("Chi "+c.name+" ("+c.count+" người)",c.id));
    });
    sel.onchange=function(){ opts.branch=sel.value; note(); };
    f.appendChild(sel);

    f=field(b,"Kèm theo");
    var lab=el("label"); lab.style.cssText="display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-weight:400";
    var cb=el("input"); cb.type="checkbox"; cb.checked=true; cb.style.cssText="width:auto;margin-top:3px";
    cb.onchange=function(){ opts.table=cb.checked; };
    lab.appendChild(cb);
    lab.appendChild(el("span","","Danh sách thành viên dạng bảng ở trang sau, có đời, năm sinh, năm mất, ngày giỗ và cha mẹ. Với cây lớn thì bảng này dễ tra hơn hình vẽ nhiều."));
    f.appendChild(lab);

    var info=el("div","print-note"); b.appendChild(info);
    function note(){
      var n=opts.branch
        ? (State.chiList||[]).filter(function(c){ return c.id===opts.branch; })[0]
        : null;
      var count=n?n.count:State.people.length;
      var msg;
      if(opts.mode==="one"){
        msg="Trang in sẽ rộng đúng bằng cây, hợp để lưu PDF hoặc mang đi in khổ lớn. "+
            "Chữ giữ nguyên cỡ nên đọc được, nhưng tệp sẽ có một trang rất to.";
      } else {
        msg="Cây được thu lại cho vừa một tờ "+opts.paper.toUpperCase()+" nằm ngang. "+
            (count>60?"Với "+count+" người thì chữ sẽ khá nhỏ, nên bật kèm bảng danh sách.":"In ra là đọc được ngay.");
      }
      info.textContent=msg;
    }
    note();
  },function(mf,close){
    mf.appendChild(el("div","sp"));
    var c=el("button","btn","Hủy"); c.onclick=close; mf.appendChild(c);
    var ok=el("button","btn pri","Mở hộp in");
    ok.onclick=function(){
      close();
      setupPrint(opts);
      /* Chờ trình duyệt vẽ lại rồi mới mở hộp in, nếu không nó chụp bản cũ. */
      setTimeout(function(){ window.print(); },180);
    };
    mf.appendChild(ok);
  });
}

/* ================== gắn sự kiện ================== */
function togglePop(pop,build){
  var open=pop.hidden;
  $$(".pop").forEach(function(p){ p.hidden=true; });
  if(open){ build&&build(); pop.hidden=false; }
}
function bindUI(){
  $("#zIn").onclick=function(){ zoomBy(1.25); };
  $("#zOut").onclick=function(){ zoomBy(1/1.25); };
  $("#zFit").onclick=function(){ fitView(true); };
  $("#drwClose").onclick=closeDrawer;
  $("#btnCfg").onclick=openSetup;
  $("#btnPrint").onclick=openPrint;
  $("#btnAdd").onclick=function(){ openPerson(null); };

  /* Bấm Ctrl+P thẳng cũng phải ra bản in tử tế, không phải ảnh chụp màn hình
     bị cắt cụt. Dọn lại ngay sau khi hộp in đóng. */
  window.addEventListener("beforeprint",function(){
    if(!Print.on&&State.people.length) setupPrint({mode:"one",table:true});
  });
  window.addEventListener("afterprint",teardownPrint);
  $("#btnGio").onclick=function(e){ e.stopPropagation(); togglePop($("#popGio"),renderGio); };
  $("#btnStat").onclick=function(e){ e.stopPropagation(); togglePop($("#popStat"),renderStats); };
  $("#btnUser").onclick=function(e){
    e.stopPropagation();
    if(!loggedIn()){ $$(".pop").forEach(function(p){ p.hidden=true; }); openLogin(); return; }
    togglePop($("#popUser"),renderUserPop);
  };
  document.addEventListener("click",function(e){
    if(!e.target.closest(".pop")&&!e.target.closest("#btnGio")&&!e.target.closest("#btnStat")&&!e.target.closest("#btnUser"))
      $$(".pop").forEach(function(p){ p.hidden=true; });
  });
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape") return;
    if($("#modalHost").firstChild){ $("#modalHost").innerHTML=""; return; }
    var open=$$(".pop").filter(function(p){ return !p.hidden; });
    if(open.length){ open.forEach(function(p){ p.hidden=true; }); return; }
    if($("#drawer").classList.contains("open")) closeDrawer();
  });
}

/* ================== khởi động ================== */
function boot(){
  var cfg=loadCfg();
  applyTheme(cfg.theme||"auto");
  bindStage(); bindSearch(); bindUI();
  Api.url=cfg.scriptUrl||"";
  try{ Api.token=localStorage.getItem(TOKKEY)||""; }catch(e){ Api.token=""; }
  if(CONFIG.sheetId&&!cfg.sheetId&&!Api.on){ cfg.sheetId=CONFIG.sheetId; cfg.sheetName=CONFIG.sheetName; }

  /* Một lượt gọi duy nhất lúc mở trang: danh sách người, phiên đăng nhập và
     tình trạng tài khoản về cùng một lần. Apps Script xếp hàng các lượt gọi
     nên gọi ít đi là trang mở nhanh hẳn. */
  if(Api.on){ loadScript(); return; }
  if(cfg.sheetId){ loadSheet(cfg.sheetId,cfg.sheetName||"GiaPha"); return; }
  if(cfg.paste){
    try{ setPeople(rowsToPeople(parseCSV(cfg.paste)),"paste"); return; }
    catch(e){ toast("Dữ liệu dán tay bị lỗi: "+e.message); }
  }
  fetch("data.csv",{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("no file"); return r.text(); })
    .then(function(t){ setPeople(rowsToPeople(parseCSV(t)),"local"); })
    .catch(function(){
      setPeople(DEMO.map(normalize),"demo");
      setBanner(PREVIEW
        ? "Bản xem thử với <b>một gia đình giả định</b>. Bấm vào từng người để xem chi tiết, thử nút Giỗ sắp tới và nút thống kê để lọc theo chi."
        : "Đây là <b>dữ liệu mẫu</b> để bạn xem giao diện. Nối Google Sheet của gia đình để thay bằng người thật.",
        [{label:PREVIEW?"Dán dữ liệu của tôi":"Nối dữ liệu của tôi",pri:true,fn:openSetup}]);
    });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
